name: seblak_kacida
description: "Aplikasi POS Seblak Kacida"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  fl_chart: ^0.68.0
  crypto: ^3.0.3
  uuid: ^4.2.1
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  path_provider: ^2.1.2
  http: ^1.2.1
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12

flutter_launcher_icons:

  android: true
  ios: true
  web:
    generate: true
    favicon: true
  image_path: "assets/images/logo/logo_usaha.jpg"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/
    - assets/images/base seblak/
    - assets/images/topping/
    - assets/images/sayur/